<!DOCTYPE html>
<html style="width:100%;height:100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页</title>
</head>
<style>
    /* 跟随系统深浅色：ArkTS 侧 Web 使用 WebDarkMode.Auto，页面自绘配色避免被整体反色 */
    :root {
        color-scheme: light dark;
        --bg: #fdfdfd;
        --fg: #000000;
        --card-alpha: rgba(255, 255, 255, 0.7);
        --press: #e4e4e4;
        --shadow: 0 4px 10px rgb(0 0 0 / 10%);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #101215;
            --fg: #e6e6e6;
            --card-alpha: rgba(255, 255, 255, 0.12);
            --press: #2a2e35;
            --shadow: 0 4px 10px rgb(0 0 0 / 45%);
        }
    }
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--bg);
        color: var(--fg);
    }
    /* 页面纵向流式布局：搜索区固定，站点区占满剩余高度并可滚动，矮屏/横屏不会截断图标 */
    .page {
        display: flex;
        flex-direction: column;
        background-color: var(--bg);
        width: 100%;
        height: 100%;
    }
    .phone {
        justify-content: space-around;
        align-content: flex-start;
        display: flex;
        margin-left: 16px;
        margin-right: 16px;
        margin-top: 40px;
        flex-wrap: wrap;
    }
    #test {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    .searchArea {
        min-width: 150px;
        font-size: 1.9rem;
        position: relative;
        height: 48px;
        margin: 0 auto;
        box-shadow: var(--shadow);
        width: 80%;
        margin-top: 20%;
        z-index: 4;
    }
    /* 横屏时屏幕高度紧张，压缩搜索区上方留白，避免站点区被挤出可视范围 */
    @media (orientation: landscape) {
        .searchArea {
            margin-top: 8%;
        }
        .phone {
            margin-top: 16px;
        }
    }
    .searchFirm {
        width: 33px;
        height: 33px;
        float: left;
        border-top-left-radius: 8px;
        border-bottom-left-radius: 8px;
        position: absolute;
        left: 15px;
        z-index: 2;
    }
    .searchFirmIcon {
        width: 20px;
        height: 20px;
        margin: 13px auto ;
        cursor: pointer;
        background-position: 24px -24px;
        background-size: 20px;
        background-repeat: no-repeat;
    }
    .sfBaidu {
        background-position: 0 -40px;
    }

    #searchCon {
        height: 100%;
        background: transparent;
        color: var(--fg);
        border: none;
        font-size: 17px;
        z-index: 2;
        position: absolute;
        /* 左侧留给搜索源图标、右侧留给搜索按钮，输入区居中不自适应撑开 */
        left: 48px;
        right: 44px;
        width: auto;
        outline: none;
    }
</style>
<script>
    var isPhone = false;
    function initPhone() {
        console.info('function init')
		isPhone = true
		func1()
		console.info('function init end')
	}
	function initPad() {
	    isPhone = false
		func1()
	}
	// WebTab onPageEnd 时由 ArkTS 侧 runJavaScript 调用，手机页无需缩放适配，保持空实现
	function adapterDevice() {
	    console.info('function adapterDevice');
	}
	function uploadWord() {
        let inputDom = document.getElementById("searchCon")
        console.info(`inputDom.value= ${inputDom.value}`)
        etsObj.searchWord(inputDom.value)
    }

    function func1() {
       let array = [{src: "./bing.png", name:"必应", addr: "bing.com"},
                 {src: "./bilibili.png", name: "哔哩哔哩", addr: "www.bilibili.com"},
                 {src: "./dianping.png", name: "大众点评", addr:"www.dianping.com"},
                 {src: "./dongchedi.png", name:"懂车帝", addr:"www.dongchedi.com"},
                 {src: "./jingdong.png", name: "京东", addr:"www.jd.com"},
                 {src: "./pinduoduo.png", name: "拼多多", addr:"www.pinduoduo.com"},
				 {src: "./sohu.png", name:"搜狐", addr: "www.sohu.com"},
                 {src: "./weibo.png", name:"微博", addr: "weibo.com/"},
                 {src: "./weipinhui.png", name:"唯品会", addr:"www.vip.com"},
                 {src: "./yuedu.png", name:"阅读", addr:"m.zhangyue.com"},
                 {src: "./zhihu.png", name:"知乎", addr:"www.zhihu.com"},
                 {src: "./meituan.png", name:"美团", addr:"meituan.com"},]
      var div = document.getElementById("test")
      div.className = isPhone ? "phone" : "tablet"
      for(let i = 0; i < array.length; i++) {
        let box = document.createElement("div")
		box.style.display = 'flex'
		box.style.flexDirection = 'column'
		box.style.justifyContent = 'center'
		box.style.alignItems = 'center'
		box.style.height = '104px'
		box.style.minWidth = '88px'
		box.style.margin = '4px'
		box.style.borderRadius = '15px'
		box.addEventListener('touchstart', function(e){
			box.style.backgroundColor = 'var(--press)'
		})
		box.addEventListener('touchend', function(e){
			box.style.backgroundColor = 'transparent'
		})
        let text = document.createElement('p')
		text.innerHTML = array[i].name
        text.style.fontSize = '12px'
        text.style.fontWeight = 400
        var image = new Image()
        image.src = array[i].src
        image.style.width = '48px'
		image.style.height = '48px'
        image.onclick = function() {
            console.info('image.onclick')
            etsObj.test(array[i].addr)
        }
        box.appendChild(image)
        box.appendChild(text)
        div.appendChild(box)
      }

    }

    function searchWord(e) {
        console.info(`searchWord keyCode=${e.keyCode}`)
        if (e.keyCode == 13) {
            let inputDom = document.getElementById("searchCon")
            console.info(`phone inputDom.value=${inputDom.value}`)
            etsObj.searchWord(inputDom.value)
            return true
        }
    }
 </script>
<body onload="initPhone()">
<div class="page">
    <div class="searchArea" style="border-radius: 60px; display: block; background-color: var(--card-alpha); flex-shrink: 0;">
        <div class="searchFirm" style="border-bottom-left-radius: 8px; border-top-left-radius: 8px;">
            <div class="searchFirmIcon sfBaidu" style="background-image: url(./all.png);">
            </div>
        </div>
        <form autocomplete="off">
            <input id="searchCon" onkeypress="return event.keyCode != 13;" type="text" autocomplete="off" onkeyup="searchWord(event)"
                   style="border-bottom-right-radius: 8px;border-top-right-radius: 8px; text-align: left;">
        </form>
        <div style="display:flex;height: 100%; width: 33px;position: absolute; right:18px; z-index: 3;
            align-items: center;justify-content: center;" onclick="uploadWord()">
            <img src="./search.svg" style="width: 20px; height: 20px;">
        </div>
    </div>
    <div id="test"></div>
</div>
</body >
</html>
